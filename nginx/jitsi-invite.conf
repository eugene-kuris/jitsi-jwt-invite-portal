# Add this snippet inside the existing HTTPS server block for Jitsi Meet.

location = /invite {
    return 308 /invite/;
}

# Organizer portal. Access is protected by individual nginx accounts.
location ^~ /invite/ {
    auth_basic "Jitsi Invite";
    auth_basic_user_file /etc/nginx/jitsi-invite.htpasswd;

    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Remote-User $remote_user;

    proxy_pass http://unix:/run/jitsi-invite/jitsi-invite.sock:;
}

# Public guest landing page. It can issue only guest JWTs.
location ^~ /join/ {
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Never inherit an organizer identity on the public route.
    proxy_set_header X-Remote-User "";

    proxy_pass http://unix:/run/jitsi-invite/jitsi-invite.sock:;
}
